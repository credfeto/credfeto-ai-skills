---
# Per-agent frontmatter settings for the generated agent definitions in
# ai/agents/<slug>/AGENT.md. Keys are agent slugs; each agent is installed as
# credfeto-<slug>. `name` is the source heading in agent-roles.instructions.md
# and never appears in generated frontmatter. `skills` lists installed skill
# names to preload at agent startup.

# mcp__cfwf__* (the workflow MCP), mcp__build-dotnet__* (the .NET build MCP),
# mcp__git__* (the git MCP) and mcp__kb__* (the knowledge-base MCP) are granted
# to the agents that do GitHub work, build and test code, use git or research,
# so a sub-agent can use them as well as the top-level session. git and kb are
# placeholders until those servers are registered. Revisit these grants
# when the full workflow and build MCP servers ship: narrow them per agent, and
# drop the matching Bash use where the MCP replaces it.

# mcp__codegraph__codegraph_explore (the CodeGraph MCP's codegraph_explore
# tool) and the credfeto-codegraph skill are granted to the agents that locate,
# read or review code, so they use codegraph_explore to locate and understand
# code when a repository is indexed. Unlike the wildcard grants above, this one
# is already narrowed to a single tool, because the credfeto-codegraph skill
# allows only codegraph_explore. The grant is harmless where no CodeGraph
# server is configured.
# ToolSearch is granted alongside it because the tools: list is a strict
# allowlist and Claude Code may defer MCP tools until loaded by ToolSearch.

default:
  model: opus
  tools: [Read, Grep, Glob, Skill]
  skills: []

orchestrator:
  name: "Orchestrator"
  model: opus
  tools:
    - Bash
    - Agent
    - Skill
    - ScheduleWakeup
    - Read
    - Grep
    - Glob
    - SendMessage
    - TaskStop
    - "mcp__cfwf__*"
    - "mcp__git__*"
    - "mcp__kb__*"
    - "mcp__codegraph__codegraph_explore"
    - ToolSearch
  skills:
    - credfeto-agent-routing
    - credfeto-issue-plan-approval
    - credfeto-pr-review-loop
    - credfeto-pr-sync
    - credfeto-codegraph

