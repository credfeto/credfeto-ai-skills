--- # Fail if ai/agents/config.yaml preloads a skill that has no folder in ai/skills
# Maintain in repo: credfeto-ai-skills
name: "Check Agent Skills"
description: "Fails if any skill listed in ai/agents/config.yaml has no ai/skills/<skill>/SKILL.md"

runs:
  using: composite
  steps:
    - name: "Check preloaded skills exist"
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const fs = require('node:fs');

          const config = fs.readFileSync('ai/agents/config.yaml', 'utf8');
          const skills = new Set(Array.from(config.matchAll(/^\s+-\s+credfeto-([a-z0-9-]+)\s*$/gm), (match) => match[1]));
          const missing = Array.from(skills).filter((skill) => !fs.existsSync(`ai/skills/${skill}/SKILL.md`)).sort();

          if (missing.length === 0) {
            core.info(`✅ All ${skills.size} preloaded skills exist`);
            return;
          }

          for (const skill of missing) {
            core.error(`❌ ai/agents/config.yaml preloads credfeto-${skill}, but ai/skills/${skill}/SKILL.md does not exist`, { file: 'ai/agents/config.yaml' });
          }

          core.setFailed('ai/agents/config.yaml preloads skills that no longer exist; update it in a reviewed pull request');
