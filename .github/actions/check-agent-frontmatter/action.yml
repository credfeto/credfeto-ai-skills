--- # Fail if any generated agent's frontmatter differs from ai/agents/config.yaml
# Maintain in repo: credfeto-ai-skills
name: "Check Agent Frontmatter"
description: "Fails if the name, model, tools or skills in any ai/agents/<slug>/AGENT.md differ from ai/agents/config.yaml"

runs:
  using: composite
  steps:
    - name: "Check agent frontmatter matches config.yaml"
      shell: bash
      run: python3 "${GITHUB_ACTION_PATH}/check_agent_frontmatter.py"
