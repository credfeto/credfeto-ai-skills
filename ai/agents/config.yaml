---
# Per-agent frontmatter settings for the generated agent definitions in
# ai/agents/<slug>/AGENT.md. Keys are agent slugs; each agent is installed as
# credfeto-<slug>. `name` is the source heading in agent-roles.instructions.md
# and never appears in generated frontmatter. `skills` lists installed skill
# names to preload at agent startup.

# mcp__cfwf__* (the workflow MCP), the build MCPs (mcp__build-dotnet__*,
# mcp__build-node__* and mcp__build-python__*), mcp__changelog__* (the
# changelog MCP), mcp__git__* (the git MCP) and mcp__kb__* (the knowledge-base
# MCP) are granted to the agents that do GitHub work, build and test code, edit
# the changelog, use git or research, so a sub-agent can use them as well as
# the top-level session. The Orchestrator and every agent with a build MCP
# grant hold all three build MCPs and the changelog MCP; the Changelog agent
# holds the changelog MCP. Every agent holding mcp__kb__* preloads the
# credfeto-learnings-capture skill, which says when to use it, and every agent
# holding any mcp__cfwf__ tool preloads credfeto-github-cli-pitfalls.
# build-node and build-python are placeholders until those servers ship, and
# changelog, git and kb are placeholders until those servers are registered.
# Revisit these grants when the full workflow and build MCP servers ship:
# narrow them per agent, and drop the matching Bash use where the MCP replaces
# it.

# mcp__codegraph__codegraph_explore (the CodeGraph MCP's codegraph_explore
# tool) and the credfeto-codegraph skill are granted to the agents that locate,
# read or review code, so they use codegraph_explore to locate and understand
# code when a repository is indexed. Unlike the wildcard grants above, this one
# is already narrowed to a single tool, because the credfeto-codegraph skill
# allows only codegraph_explore. The grant is harmless where no CodeGraph
# server is configured.
# ToolSearch is granted alongside it, and to every agent with an MCP grant,
# because the tools: list is a strict allowlist and Claude Code may defer MCP
# tools until loaded by ToolSearch.

# The IDE MCPs (mcp__datagrip__*, mcp__rider__* and mcp__webstorm__*) are
# granted, and the credfeto-ide-mcp-code-analysis skill preloaded, to the
# agents that apply IDE MCP Code Analysis
# (ai/global/code-quality.instructions.md), including the Orchestrator, which
# applies it itself during the review loop. The grants are harmless where no
# IDE server is connected. Code Writer and Code Tester, which hold no
# mcp__cfwf__* grant, get only mcp__cfwf__comment_add, so they can comment on
# the PR naming an unavailable IDE MCP, as credfeto-ide-mcp-code-analysis
# requires, without the rest of the workflow MCP.

# The mechanical roles (changelog, committer, pr-submitter, ci-monitor and
# code-tester) are not granted the Skill tool: their preloaded skills hold
# everything they need, and without Skill they cannot load a skill that edits
# configuration to work around a hook or permission block. check_agents.py
# fails if any of them lists Skill.

default:
  model: opus
  tools: [Read, Grep, Glob, Skill]
  skills: []

orchestrator:
  name: "Orchestrator"
  model: opus
  tools:
    - Bash
    - Agent
    - Skill
    - ScheduleWakeup
    - Read
    - Grep
    - Glob
    - SendMessage
    - TaskStop
    - "mcp__datagrip__*"
    - "mcp__rider__*"
    - "mcp__webstorm__*"
    - "mcp__cfwf__*"
    - "mcp__build-dotnet__*"
    - "mcp__build-node__*"
    - "mcp__build-python__*"
    - "mcp__changelog__*"
    - "mcp__git__*"
    - "mcp__kb__*"
    - "mcp__codegraph__codegraph_explore"
    - ToolSearch
  skills:
    - credfeto-agent-routing
    - credfeto-issue-plan-approval
    - credfeto-pr-review-loop
    - credfeto-pr-sync
    - credfeto-ide-mcp-code-analysis
    - credfeto-learnings-capture
    - credfeto-github-cli-pitfalls
    - credfeto-codegraph

