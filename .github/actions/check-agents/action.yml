--- # Fail if agent definitions disagree with ai/agents/config.yaml
# Maintain in repo: credfeto-ai-skills
name: "Check Agents"
description: >-
  Fails if a preloaded skill is missing, or (unless skills-only) an agent is
  missing, its frontmatter differs from ai/agents/config.yaml or a mechanical
  role lists the Skill tool

inputs:
  skills-only:
    description: "Only check that preloaded skills exist ('true' or 'false')"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: "Check agents match config.yaml"
      shell: bash
      env:
        SKILLS_ONLY: "${{inputs.skills-only}}"
      run: python3 "${GITHUB_ACTION_PATH}/check_agents.py"
