---
# Per-agent frontmatter settings for the generated agent definitions in
# ai/agents/<slug>/AGENT.md. Keys are agent slugs; each agent is installed as
# credfeto-<slug>. `name` is the source heading in agent-roles.instructions.md
# and never appears in generated frontmatter. `skills` lists installed skill
# names to preload at agent startup.

default:
  model: opus
  tools: [Read, Grep, Glob, Skill]
  skills: []

orchestrator:
  name: "Orchestrator"
  model: opus
  tools: [Bash, Agent, Skill, ScheduleWakeup, Read, Grep, Glob, SendMessage, TaskStop]
  skills:
    - credfeto-agent-routing
    - credfeto-issue-plan-approval
    - credfeto-pr-review-loop
    - credfeto-pr-sync

coding-researcher:
  name: "Coding Researcher"
  model: opus
  tools: [WebFetch, WebSearch, Read, Grep, Glob, Skill]
  skills: []

code-writer:
  name: "Code Writer"
  model: opus
  tools: [Read, Write, Edit, Grep, Glob, Bash, Agent, Skill, "mcp__rider__*", "mcp__webstorm__*", SendMessage]
  skills:
    - credfeto-code-writer
    - credfeto-code-style

code-tester:
  name: "Code Tester"
  model: haiku
  tools: [Bash, Read, Grep, Glob, Skill, "mcp__rider__*", "mcp__webstorm__*"]
