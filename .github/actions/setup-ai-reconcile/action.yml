--- # Install the tools the AI reconcile workflows need: dotnet, the changelog tool, markdownlint and, optionally, Claude Code
# Maintain in repo: credfeto-ai-skills
name: "Setup AI Reconcile"
description: "Installs dotnet, the changelog tool, markdownlint and, unless install-claude-code is 'false', the Claude Code CLI for the AI reconcile workflows"

inputs:
  github-token:
    description: "Token used by the dotnet install"
    required: true
  nuget-public-restore-feed-cache:
    description: "Public NuGet restore feed cache"
    required: true
  nuget-public-restore-feed:
    description: "Public NuGet restore feed"
    required: true
  install-claude-code:
    description: "Install the Claude Code CLI ('true' or 'false'); jobs that only validate and push do not need it"
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: "Install dotnet"
      uses: ./.github/actions/dotnet-install
      with:
        github-token: "${{inputs.github-token}}"
        nuget-public-restore-feed-cache: "${{inputs.nuget-public-restore-feed-cache}}"
        nuget-public-restore-feed: "${{inputs.nuget-public-restore-feed}}"
        nuget-additional-restore-feed-release-cache: ""
        nuget-additional-restore-feed-prerelease-cache: ""
        nuget-additional-restore-feed-release: ""
        nuget-additional-restore-feed-prerelease: ""

    - name: "Install changelog tool"
      uses: ./.github/actions/dotnet-tool
      with:
        tool-name: "Credfeto.ChangeLog.Cmd"

    # One npm install call so each job pays for a single npm start-up.
    # Claude Code is installed unpinned so it always knows about current models.
    - name: "Install npm tools"
      shell: bash
      run: |
        packages=("markdownlint-cli@0.49.1")
        if [ "${INSTALL_CLAUDE_CODE}" = "true" ]; then
          packages+=("@anthropic-ai/claude-code")
        fi
        npm install -g --save-exact "${packages[@]}"
        echo "✅ markdownlint $(markdownlint --version) installed"
        if [ "${INSTALL_CLAUDE_CODE}" = "true" ]; then
          echo "✅ Claude Code $(claude --version) installed"
        fi
      env:
        INSTALL_CLAUDE_CODE: "${{inputs.install-claude-code}}"
